name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Check code formatting with ruff
        run: |
          ruff format --check src/ tests/

      - name: Lint codebase with ruff
        run: |
          ruff check src/ tests/

      - name: Run static type analysis with mypy
        run: |
          mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run test suite with pytest
        run: |
          pytest -v tests/

  smoke-test:
    name: End-to-End Pipeline Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rl,gui,dev]"

      - name: Verify CLI entry points
        run: |
          adaptive-rl --help
          adaptive-rl version
          adaptive-rl env inspect drone
          adaptive-rl config validate configs/drone_ppo_demo.yaml
          adaptive-rl gui --help

      # Trains on configs/ci_smoke.yaml (512 steps), then verifies checkpoints, reload,
      # evaluation.json schema and deterministic demo. Failures name the broken stage.
      - name: Run end-to-end pipeline smoke test
        run: |
          pytest -v tests/test_e2e_smoke.py

      - name: Run research protocol smoke test
        run: |
          pytest -v tests/test_research_protocol_smoke.py
